type: object
properties:
  name:
    type: string
  phoneNumber:
    type: string
  email:
    type: string
    format: email
    nullable: true
  isFavourite:
    type: boolean
    default: false
  contactType:
    type: string
    enum:
      - work
      - home
      - personal
required:
  - name
  - phoneNumber
  - contactType

example:
  name: "John Doe"
  phoneNumber: "+380501234567"
  email: "john@example.com"
  isFavourite: false
  contactType: "personal"
